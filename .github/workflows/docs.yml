name: Docs

on:
  push:
    branches: [main]
    paths:
      - "packages/utils/src/**/*.ts"
      - "packages/utils/__tests__/**"
      - "apps/docs/**"
      - "scripts/**"
      - "package.json"
      - "turbo.json"
      - "pnpm-workspace.yaml"
      - ".github/workflows/docs.yml"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      DOCS_GISCUS_CATEGORY_ID: ${{ vars.DOCS_GISCUS_CATEGORY_ID }}
      DOCS_UMAMI_SCRIPT_URL: ${{ vars.DOCS_UMAMI_SCRIPT_URL }}
      DOCS_UMAMI_WEBSITE_ID: ${{ vars.DOCS_UMAMI_WEBSITE_ID }}
      DOCS_GISCUS_CATEGORY: ${{ vars.DOCS_GISCUS_CATEGORY }}
      DOCS_GISCUS_REPO_ID: ${{ vars.DOCS_GISCUS_REPO_ID }}
      DOCS_GISCUS_REPO: ${{ vars.DOCS_GISCUS_REPO }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install

      - name: Run tests
        run: pnpm test

      - name: Build with rspress
        run: pnpm docs:build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: apps/docs/doc_build

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
